# One-command local stack: PostgreSQL, the API, the outbox worker and the web app.
#
#     docker compose up --build
#     open http://localhost:8080
#
# Sign in with any demo account from README.md (all share the password
# `Newtonite!2026`), for example `lena.lead@newtonite.dev`.
#
# Why the web app is on 8080 and the API on 8000: the web container serves the SPA and
# forwards `/api` to the API container, so the browser uses one origin (`:8080`) and no CORS
# permission is involved. The API is also published directly on :8000 so its health
# endpoints and OpenAPI document can be inspected without going through the proxy.
#
# The `db` service is also usable on its own, with the host port and credentials the rest of
# the documentation uses:
#
#     docker compose up -d db
#     export DATABASE_URL=postgresql+asyncpg://newtonite:newtonite_dev_pw@127.0.0.1:5433/newtonite
#
# Credentials here are local-development placeholders, not secrets.

services:
  db:
    image: postgres:16-alpine
    container_name: newtonite-db
    environment:
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite_dev_pw
      POSTGRES_DB: newtonite
    ports:
      - "5433:5432"
    volumes:
      - newtonite_pgdata:/var/lib/postgresql/data
      # Creates the additional test database on first start.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: newtonite-api
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://newtonite:newtonite_dev_pw@db:5432/newtonite
      # Only the proxy origin, because the browser uses it for everything.
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      # Migrations run in the entrypoint; the seed is idempotent, so restarts are harmless.
      SEED_ON_START: "1"
      SEED_ITEMS: "3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      # `readyz` checks the database too, which is exactly the condition the worker needs
      # before it starts claiming rows.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: newtonite-worker
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://newtonite:newtonite_dev_pw@db:5432/newtonite
      # The API seeds and migrates; the worker only consumes.
      SEED_ON_START: "0"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: newtonite-web
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  newtonite_pgdata:
