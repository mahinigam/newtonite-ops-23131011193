# The web container.
#
# One origin, two jobs: serve the built SPA, and forward `/api` to the API container. Doing
# the forwarding here rather than letting the browser call `http://localhost:8000` directly
# means the image has no machine-specific host name baked into it and the deployment needs
# no CORS permission at all.
#
# The app uses hash routing, so every path under `/` is really the same `index.html`; the
# `try_files` fallback is what makes a deep link work if that ever changes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, unchanged: `proxy_pass` without a trailing path keeps the full URI, so
    # `/api/v1/teams` arrives at the API as `/api/v1/teams`.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The refresh endpoint needs the HttpOnly cookie to be forwarded. Ensure the
    # cookie path is preserved so the browser sends it only to /api/v1/auth/refresh.
    location /api/v1/auth/refresh {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api/v1/auth/refresh /api/v1/auth/refresh;
    }

    # Liveness and readiness are part of the API surface a reviewer may want to check.
    location = /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
