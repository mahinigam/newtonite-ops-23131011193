name: CI

# Runs the checks that exist today. Both jobs are independent: a frontend failure
# does not hide a backend one, and neither job needs the other's artefacts.

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    # Pinned rather than `ubuntu-latest`: the latest label is scheduled to move
    # to Ubuntu 26 during the assessment window, and a silent base-image change
    # in the middle of it is an avoidable variable.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: newtonite
          POSTGRES_PASSWORD: newtonite_dev_pw
          POSTGRES_DB: newtonite
        ports:
          - 5432:5432
        # Without a healthy service the test job would fail with a confusing
        # connection error instead of a clear one.
        options: >-
          --health-cmd "pg_isready -U newtonite -d newtonite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://newtonite:newtonite_dev_pw@127.0.0.1:5432/newtonite
      TEST_DATABASE_URL: postgresql+asyncpg://newtonite:newtonite_dev_pw@127.0.0.1:5432/newtonite_test
      PGPASSWORD: newtonite_dev_pw

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Create the disposable test database
        run: psql -h 127.0.0.1 -U newtonite -d newtonite -c "CREATE DATABASE newtonite_test OWNER newtonite;"

      - name: Install uv
        # setup-uv publishes exact tags only (there is no moving `v10` tag), so
        # this is pinned to a concrete version rather than a major alias.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      # Exercises the documented setup path end to end on a clean database:
      # migrate, then seed. A broken migration or seed fails CI here rather than
      # in a reviewer's terminal.
      - name: Migrate the development database
        run: uv run alembic upgrade head

      - name: Seed a small dataset
        run: uv run python -m scripts.seed --items 200

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the version the lockfile was produced with.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the locked tree,
      # so CI cannot pass on a dependency the repository does not pin.
      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  docker-compose-smoke:
    name: Docker Compose (clean checkout)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Exercise the documented one-command reviewer setup from a fresh checkout.
      - name: Build and start the reviewer stack
        run: docker compose up --build -d

      - name: Wait for readiness and smoke-test the app
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "The stack did not become ready within five minutes." >&2
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

          echo "API readiness: passed"
          echo "Web entry point: passed"

      - name: Show stack state and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans

